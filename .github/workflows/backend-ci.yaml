name: Backend CI Pipeline

# Se activa al hacer push o PR hacia las ramas principales
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # --- LA MAGIA: Levantamos una BD temporal para los tests ---
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: pos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    defaults:
      run:
        working-directory: ./backend 

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Instalar dependencias de Go
      run: go mod tidy

    # --- REVISIÓN ESTRICTA (NIVEL 2) ---

    - name: 1. Verificar formato del código (Linter)
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then 
          echo "ERROR: Hay archivos desordenados. Ejecuta 'go fmt ./...' en tu PC antes de subir el código."
          exit 1
        fi

    - name: 2. Ejecutar Pruebas Unitarias
      run: go test -v ./...

    - name: 3. Compilar Backend (Build)
      run: go build -v ./...
